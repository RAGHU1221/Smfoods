name: Build Sri Murugan Foods APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:

    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout source
        uses: actions/checkout@v4


      # ==========================================
      # 2. Setup Node.js 24
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm


      # ==========================================
      # 3. Setup Java 21
      # ==========================================
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'


      # ==========================================
      # 4. Check Environment
      # ==========================================
      - name: Check environment
        run: |
          echo "======================================"
          echo "Environment"
          echo "======================================"

          echo "Node:"
          node --version

          echo "NPM:"
          npm --version

          echo "Java:"
          java -version

          echo "JAVA_HOME:"
          echo "$JAVA_HOME"


      # ==========================================
      # 5. Install dependencies
      # ==========================================
      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund


      # ==========================================
      # 6. Install Capacitor
      # ==========================================
      - name: Install Capacitor
        run: |
          npm install \
            @capacitor/core@7.6.9 \
            @capacitor/cli@7.6.9 \
            @capacitor/android@7.6.9 \
            --save \
            --no-audit \
            --no-fund


      # ==========================================
      # 7. Remove old Capacitor configs
      # ==========================================
      - name: Remove old Capacitor configs
        run: |
          rm -f capacitor.config.ts
          rm -f capacitor.config.js
          rm -f capacitor.config.cjs
          rm -f capacitor.config.json

          echo "Old Capacitor config files removed."


      # ==========================================
      # 8. Create Capacitor JSON config
      # ==========================================
      - name: Create Capacitor config
        run: |

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.srimuruganfoods.pos",
            "appName": "Sri Murugan Foods POS",
            "webDir": "dist",
            "bundledWebRuntime": false,
            "android": {
              "backgroundColor": "#b91c1c"
            }
          }
          EOF

          echo "======================================"
          echo "Capacitor config"
          echo "======================================"

          cat capacitor.config.json


      # ==========================================
      # 9. Verify appId
      # ==========================================
      - name: Verify Capacitor config
        run: |

          if [ ! -f "capacitor.config.json" ]; then
            echo "ERROR: capacitor.config.json not found."
            exit 1
          fi

          grep -q '"appId": "com.srimuruganfoods.pos"' \
            capacitor.config.json

          if [ $? -ne 0 ]; then
            echo "ERROR: appId is missing."
            exit 1
          fi

          echo "appId verified successfully."


      # ==========================================
      # 10. Verify Capacitor
      # ==========================================
      - name: Verify Capacitor
        run: |

          echo "======================================"
          echo "Capacitor version"
          echo "======================================"

          npx cap --version


      # ==========================================
      # 11. Build Web Application
      # ==========================================
      - name: Build web application
        run: |

          echo "======================================"
          echo "Building web application"
          echo "======================================"

          npm run build


      # ==========================================
      # 12. Verify dist
      # ==========================================
      - name: Verify web build
        run: |

          if [ ! -d "dist" ]; then
            echo "ERROR: dist folder was not created."
            exit 1
          fi

          echo "Web build successful."

          ls -lah dist


      # ==========================================
      # 13. Create Android platform
      # ==========================================
      - name: Create Android platform
        shell: bash
        run: |

          if [ -d "android" ]; then

            echo "Android project already exists."

          else

            echo "======================================"
            echo "Android project not found."
            echo "Creating Android project..."
            echo "======================================"

            npx cap add android

          fi


      # ==========================================
      # 14. Verify Android project
      # ==========================================
      - name: Verify Android project
        shell: bash
        run: |

          if [ ! -d "android" ]; then
            echo "ERROR: Android folder was not created."
            exit 1
          fi

          if [ ! -f "android/gradlew" ]; then
            echo "ERROR: Gradle wrapper not found."
            exit 1
          fi

          if [ ! -d "android/app" ]; then
            echo "ERROR: Android app module not found."
            exit 1
          fi

          echo "======================================"
          echo "Android project verified"
          echo "======================================"


      # ==========================================
      # 15. Capacitor Sync
      # ==========================================
      - name: Capacitor sync
        run: |

          echo "======================================"
          echo "Capacitor Sync"
          echo "======================================"

          npx cap sync android


      # ==========================================
      # 16. Setup Gradle
      # ==========================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4


      # ==========================================
      # 17. Make Gradle executable
      # ==========================================
      - name: Make Gradle executable
        working-directory: android
        run: |

          chmod +x gradlew

          echo "Gradle executable."


      # ==========================================
      # 18. Verify Java inside Gradle
      # ==========================================
      - name: Verify Java for Android build
        working-directory: android
        run: |

          echo "======================================"
          echo "Java used by Gradle"
          echo "======================================"

          java -version

          echo ""
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"

          echo ""
          echo "Gradle version:"
          ./gradlew --version


      # ==========================================
      # 19. Build Debug APK
      # ==========================================
      - name: Build Debug APK
        working-directory: android
        run: |

          echo "======================================"
          echo "Building Android APK"
          echo "======================================"

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace


      # ==========================================
      # 20. Verify APK
      # ==========================================
      - name: Verify APK
        shell: bash
        run: |

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          echo "======================================"
          echo "Checking APK"
          echo "======================================"

          if [ ! -f "$APK" ]; then

            echo "ERROR: APK was not generated."

            echo ""
            echo "Searching for APK files..."

            find android -type f -name "*.apk" -print

            exit 1

          fi

          echo ""
          echo "======================================"
          echo "APK BUILD SUCCESSFUL"
          echo "======================================"
          echo ""

          ls -lh "$APK"


      # ==========================================
      # 21. Upload APK
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sri-Murugan-Foods-POS-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error


      # ==========================================
      # 22. Final Summary
      # ==========================================
      - name: Build summary
        run: |

          echo ""
          echo "=============================================="
          echo " Sri Murugan Foods POS"
          echo " Android APK Build"
          echo "=============================================="
          echo ""
          echo "App Name : Sri Murugan Foods POS"
          echo "App ID   : com.srimuruganfoods.pos"
          echo "Node     : 24"
          echo "Java     : 21"
          echo "Build    : Debug APK"
          echo ""
          echo "APK:"
          echo "android/app/build/outputs/apk/debug/app-debug.apk"
          echo ""
          echo "=============================================="
          echo " BUILD COMPLETED SUCCESSFULLY"
          echo "=============================================="

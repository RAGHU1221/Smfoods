name: Build Sri Murugan Foods APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 4. Install npm dependencies
      # IMPORTANT:
      # npm ci removed because package-lock.json
      # is currently not synchronized with package.json.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # 5. Make sure Capacitor packages exist
      - name: Install Capacitor
        run: |
          npm install @capacitor/core@7.6.9 @capacitor/cli@7.6.9 --save

      # 6. Build web application
      - name: Build web application
        run: npm run build

      # 7. Create Android project if it does not exist
      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "Android platform already exists"
          fi

      # 8. Sync web files to Android
      - name: Capacitor sync
        run: npx cap sync android

      # 9. Give Gradle permission
      - name: Make Gradle executable
        working-directory: android
        run: chmod +x gradlew

      # 10. Build Debug APK
      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # 11. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sri-Murugan-Foods-POS-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

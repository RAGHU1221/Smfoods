name: Build Sri Murugan Foods APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Node.js 24
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      # 3. Java 17
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 4. Check Node / NPM
      - name: Check environment
        run: |
          node --version
          npm --version

      # 5. Install project dependencies
      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund

      # 6. Install TypeScript
      # Required because capacitor.config.ts is used
      - name: Install TypeScript
        run: |
          npm install --save-dev typescript

      # 7. Install Capacitor
      - name: Install Capacitor packages
        run: |
          npm install \
            @capacitor/core@7.6.9 \
            @capacitor/cli@7.6.9 \
            @capacitor/android@7.6.9 \
            --save

      # 8. Verify TypeScript
      - name: Verify TypeScript
        run: |
          npx tsc --version

      # 9. Verify Capacitor
      - name: Verify Capacitor
        run: |
          npx cap --version

      # 10. Build web application
      - name: Build web application
        run: |
          npm run build

      # 11. Create Android project
      - name: Create Android platform
        shell: bash
        run: |
          if [ -d "android" ]; then
            echo "Android project already exists."
          else
            echo "Android project not found."
            echo "Creating Android project..."
            npx cap add android
          fi

      # 12. Sync Capacitor
      - name: Capacitor sync
        run: |
          npx cap sync android

      # 13. Verify Android project
      - name: Verify Android project
        shell: bash
        run: |
          if [ ! -d "android" ]; then
            echo "ERROR: android folder was not created."
            exit 1
          fi

          if [ ! -f "android/gradlew" ]; then
            echo "ERROR: Gradle wrapper not found."
            exit 1
          fi

          if [ ! -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "ERROR: gradle-wrapper.properties not found."
            exit 1
          fi

          echo "Android project verified successfully."

      # 14. Make Gradle executable
      - name: Make Gradle executable
        working-directory: android
        run: |
          chmod +x gradlew

      # 15. Build APK
      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      # 16. Verify APK
      - name: Verify APK
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "======================================"
          echo "APK BUILD SUCCESSFUL"
          echo "======================================"
          ls -lh "$APK"

      # 17. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sri-Murugan-Foods-POS-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

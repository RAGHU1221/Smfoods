name: Build Sri Murugan Foods APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    name: Android APK Build
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------
      # 1. Checkout
      # ---------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4

      # ---------------------------------------
      # 2. Node.js 24
      # ---------------------------------------
      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24

      # ---------------------------------------
      # 3. Java 17
      # ---------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ---------------------------------------
      # 4. Check project
      # ---------------------------------------
      - name: Check project files
        shell: bash
        run: |
          echo "Node:"
          node --version

          echo "NPM:"
          npm --version

          echo "Project:"
          ls -la

          echo "Package:"
          test -f package.json && echo "package.json OK"

      # ---------------------------------------
      # 5. Install dependencies
      # ---------------------------------------
      - name: Install npm dependencies
        run: |
          npm install --no-audit --no-fund

      # ---------------------------------------
      # 6. Install Capacitor
      # ---------------------------------------
      - name: Install Capacitor Android
        run: |
          npm install \
            @capacitor/core@7.6.9 \
            @capacitor/cli@7.6.9 \
            @capacitor/android@7.6.9 \
            --save

      # ---------------------------------------
      # 7. Build web application
      # ---------------------------------------
      - name: Build web application
        run: |
          npm run build

      # ---------------------------------------
      # 8. Create Android project
      # ---------------------------------------
      - name: Setup Android platform
        shell: bash
        run: |
          if [ -d "android" ]; then
            echo "Android folder already exists."
          else
            echo "Android folder not found."
            echo "Creating Android platform..."
            npx cap add android
          fi

      # ---------------------------------------
      # 9. Capacitor sync
      # ---------------------------------------
      - name: Capacitor sync
        run: |
          npx cap sync android

      # ---------------------------------------
      # 10. Check Gradle
      # ---------------------------------------
      - name: Check Android project
        shell: bash
        run: |
          test -d android
          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.properties

          echo "Android project OK"
          ls -la android

      # ---------------------------------------
      # 11. Make Gradle executable
      # ---------------------------------------
      - name: Make Gradle executable
        working-directory: android
        run: chmod +x gradlew

      # ---------------------------------------
      # 12. Build Debug APK
      # ---------------------------------------
      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      # ---------------------------------------
      # 13. Verify APK
      # ---------------------------------------
      - name: Verify APK
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"

      # ---------------------------------------
      # 14. Upload APK
      # ---------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sri-Murugan-Foods-POS-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
